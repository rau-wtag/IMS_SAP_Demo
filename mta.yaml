_schema-version: 3.3.0
ID: final_inventory
description: A simple CAP project.
version: 1.0.0
modules:
- name: final_inventory-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: final_inventory-auth
  - name: final_inventory-db
  - name: final_inventory-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: final_inventory-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: final_inventory-db
  parameters:
    buildpack: nodejs_buildpack
- name: final_inventory
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: final_inventory-auth
  - name: final_inventory-html5-runtime
  - name: final_inventory-destination
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: final_inventory-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: final_inventory-auth
  - name: final_inventory-destination
  - name: final_inventory-html5-repo-host
    parameters:
      config:
        HTML5Runtime_enabled: true
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - ims.zip
      name: final_inventoryims
      target-path: app/
- name: final_inventoryims
  type: html5
  path: app/ims
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
