_schema-version: 3.3.0
ID: sample
description: A simple CAP project.
version: 1.0.0
modules:
  - name: sample-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: sample-auth
      - name: sample-db
      - name: sample-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: sample-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: sample-db
    parameters:
      buildpack: nodejs_buildpack
  - name: sample
    type: approuter.nodejs
    path: app/router
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: sample-auth
      - name: sample-destination
      - name: sample-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
  - name: sample-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: sample-auth
      - name: srv-api
      - name: sample-html5-repo-host
        parameters:
          config:
            HTML5Runtime_enabled: true
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - artifacts:
            - inventory_list.zip
          name: sampleinventory_list
          target-path: app/
        - artifacts:
            - inventory_sample.zip
          name: sampleinventory_sample
          target-path: app/
        - artifacts:
            - inventoryusermanagement.zip
          name: inventoryusermanagement
          target-path: app/
  - name: sampleinventory_list
    type: html5
    path: app/inventory_list
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: sampleinventory_sample
    type: html5
    path: app/inventory_sample
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: sample-destinations
    type: com.sap.application.content
    requires:
      - name: sample-auth
        parameters:
          service-key:
            name: sample-auth-key
      - name: sample-html5-repo-host
        parameters:
          service-key:
            name: sample-html5-repo-host-key
      - name: srv-api
      - name: sample-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: sample-html5-repository
              ServiceInstanceName: sample-html5-repo-host
              ServiceKeyName: sample-html5-repo-host-key
              sap.cloud.service: sample.service
            - Authentication: OAuth2UserTokenExchange
              Name: sample-auth
              ServiceInstanceName: sample-auth
              ServiceKeyName: sample-auth-key
              sap.cloud.service: sample.service
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: inventoryusermanagement
    type: html5
    path: app/inventory_user_management
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: sample-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        tenant-mode: dedicated
        xsappname: sample-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
    requires:
      - name: app-api
  - name: sample-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: sample-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                Name: srv-api
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
      service: destination
      service-plan: lite
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
  - name: sample-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: sample-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
